<html lang="pt">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist de EPI - Bombeiros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 50px;
    }
    .container {
      background-color: white;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      position: relative;
    }
    img {
      max-width: 200px;
      margin-bottom: 20px;
    }
    h2 {
      color: #d40000;
    }
    input[type="password"] {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #d40000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #a30000;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
      background-color: white;
      margin: 15% auto;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .modal-content p {
      margin: 0;
      color: red;
      font-weight: bold;
    }
    .close-btn {
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #d40000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .password-container {
     position: relative;
     display: inline-block;
     width: 80%;
     }
     input[type="password"], input[type="text"] {
     width: 100%;
     padding: 10px 40px 10px 10px;
     margin: 10px 0;
     border: 1px solid #ccc;
     border-radius: 8px;
     font-size: 16px;
     box-sizing: border-box;
     }
    .toggle-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: #555;
    }
  </style>
</head>

    <h2>Checklist de EPI</h2>
    <p>Insere o teu <strong>número mecanográfico</strong> <br /><br />para aceder ao formulário correspondente:</p>

    <input type="password" id="password" placeholder="Número mecanográfico">
    <button class="toggle-btn" type="button" onclick="togglePassword()">👁️</button>
    </div>
    <br>
    <button id="submit">Entrar</button>
  </div>

    <div class="modal-content">
      <p>Número mecanográfico incorreto. Tenta novamente.</p>
      <button class="close-btn" onclick="document.getElementById('errorModal').style.display='none'">Fechar</button>
    </div>
  </div>

    } else {
    input.type = "password";
    btn.textContent = "👁️"; 
    }

      if (map[pw]) {

    document.getElementById("submit").addEventListener("click", run);
    document.getElementById("password").addEventListener("keypress", function (e) {
